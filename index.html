<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Digital — Catálogo</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body class="pagina-biblioteca">

    <div class="contenedor">
        <header class="cabecera">
            <div>
                <div class="sello">✦</div>
                <h1>Biblioteca Digital</h1>
                <p class="usuario" id="usuario"></p>
            </div>
            <div class="acciones">
                <button type="button" class="btn-salir" id="btn-inicio">Inicio</button>
                <button type="button" class="btn-salir" id="btn-salir">Cerrar sesión</button>
            </div>
        </header>

        <div class="barra">
            <input type="search" id="buscar" placeholder="Buscar por título o autor…" autocomplete="off">
            <select id="categoria">
                <option value="">Todas las categorías</option>
            </select>
        </div>

        <p class="estado" id="estado" role="status" aria-live="polite">Conectando con Supabase…</p>

        <section class="rejilla" id="rejilla"></section>
    </div>

    <div class="modal" id="modal">
        <div class="contenido">
            <div class="sello">✦</div>
            <h2 id="m-titulo"></h2>
            <p class="autor" id="m-autor"></p>
            <p id="m-descripcion"></p>
            <p class="anio" id="m-anio"></p>
            <button type="button" class="cerrar" id="m-cerrar">Cerrar</button>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script src="biblioteca.js"></script>
</body>
</html>
